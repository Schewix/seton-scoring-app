name: Gallery Sync

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate and upload images even when R2 objects already exist'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gallery-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY || vars.GOOGLE_DRIVE_API_KEY }}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
      GOOGLE_DRIVE_SHARED_DRIVE_ID: ${{ vars.GOOGLE_DRIVE_SHARED_DRIVE_ID }}
      GOOGLE_DRIVE_ALBUM_NAME_ALLOWLIST: ${{ vars.GOOGLE_DRIVE_ALBUM_NAME_ALLOWLIST || 'setonuv zavod, reset, draci smycka, ringobal, memorial bedricha stolicky, sraz pto, deskovky, za psem, lakros, karakoram, piotrio, brnenske bloudeni, vybijena, zabijena, draci smycky, pioples' }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_BASE_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
      GALLERY_R2_ROOT_PREFIX: ${{ vars.GALLERY_R2_ROOT_PREFIX }}
      GALLERY_R2_INDEX_PATH: ${{ vars.GALLERY_R2_INDEX_PATH }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Sync gallery to Cloudflare R2
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            npm run gallery:sync:force
          else
            npm run gallery:sync
          fi
        working-directory: scripts
